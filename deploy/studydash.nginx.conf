# StudyDash (Aloft) vhost for the shared VPS (host nginx, alongside gamedash,
# tracker, and workdash). Proxies studydash.workdash.site → the loopback port
# the container publishes (docker-compose.vps.yml → 127.0.0.1:3004).
#
# Install:
#   1. DNS: the workdash.site wildcard already points here.
#   2. cp deploy/studydash.nginx.conf /etc/nginx/sites-available/studydash
#      ln -s /etc/nginx/sites-available/studydash /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d studydash.workdash.site
#
# AUTH note: the X-Forwarded-* headers let Auth.js (AUTH_TRUST_HOST=true) see
# the public https origin, which also selects the __Secure- session cookie.
server {
    server_name studydash.workdash.site;

    # Notes uploads are capped at 10 MB in the app; leave a little headroom.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        # Card generation runs after the response, but PDF parsing can be slow.
        proxy_read_timeout 120s;
    }

    listen 80;
}
